# Gitleaks configuration for EcoIQ.
#
# Extends the upstream default rule set — nothing is disabled, no rule is
# relaxed. Allowlist entries are deliberately narrow and individually
# documented so known non-secret fixtures/checksums do not weaken detection
# for unrelated content.

[extend]
useDefault = true

[[allowlists]]
description = """
One historical test fixture, exempted by exact fingerprint.

core/tests_no_hardcoded_secrets.py is the repository's own guard against
hardcoded credentials. To prove that it detects a hardcoded API key, an early
revision contained a credential-shaped literal in an assertion. That is a true
pattern match but not a credential, and the workflow scans full history
(fetch-depth: 0), so the string remains reachable in that one commit even
though the current tree no longer contains it — commit 02e75d9 rewrote those
fixtures to be assembled at runtime instead.

The alternative was rewriting published history, which is a far worse trade for
a fabricated test string. This entry is pinned to that single finding:

  commit ea6244aedc8fba8f6d25014585c3b2123bfb57ee
  file   core/tests_no_hardcoded_secrets.py
  rule   generic-api-key
  line   173

Scoped by commit. Gitleaks 8.30 rejects an allowlist keyed only on
`fingerprints` ("must contain at least one check for: commits, paths, regexes,
or stopwords"), so the commit is the narrowing key and the fingerprint is kept
alongside it for precision. That commit introduces exactly one file — the guard
module itself — so this cannot mask anything else.

Deliberately NOT used here: `paths`, `regexes` and `stopwords`. Allowlist
conditions are OR-ed, so adding a path would exempt that file in *every*
commit, which is broader than intended. Any finding in any other commit is
still reported and still fails the build.
"""
commits = [
  "ea6244aedc8fba8f6d25014585c3b2123bfb57ee",
]
fingerprints = [
  "ea6244aedc8fba8f6d25014585c3b2123bfb57ee:core/tests_no_hardcoded_secrets.py:generic-api-key:173",
]

[[allowlists]]
description = """
Known SHA-256 checksum for the tokenizer artifact in the retrieval benchmark.

Gitleaks' generic-api-key rule treats the combination of the JSON key
"tokenizer.json" and its 64-character hexadecimal digest as credential-shaped
content. The value is a published artifact checksum, not a token or API key.

The workflow scans full pull-request history, so changing the current JSON alone
would not remove the finding from commit
889e9023d5c05f5dca4dcbb398710ce27346407b. This allowlist matches only this
exact benign digest value; it does not exempt the file, commit, token-like keys,
or other high-entropy strings.
"""
regexes = [
  '''^2c3387be76557bd40970cec13153b3bbf80407865484b209e655e5e4729076b8$''',
]
