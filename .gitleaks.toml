# Gitleaks configuration for EcoIQ.
#
# Extend the upstream default rule set. No detection rule, path, regex or
# stopword is disabled here.
#
# Historical false positives are suppressed only by exact finding fingerprint
# in .gitleaksignore. This avoids broad commit- or path-level exemptions while
# keeping the required full-history scan enabled.

[extend]
useDefault = true
