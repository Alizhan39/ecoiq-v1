name: Interactive browser checks
on:
  pull_request:
    paths:
      - 'frontend/web/**'
      - 'static/spa/**'
      - 'static/models/**'
      - 'api/interactive_catalog.py'
      - '.github/workflows/interactive-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.16'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: interactive-browser-results
          path: frontend/web/test-results/
          retention-days: 14
