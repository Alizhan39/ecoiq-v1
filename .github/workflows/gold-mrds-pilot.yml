name: Kazakhstan Gold Historical Records (Review Only)

on:
  workflow_dispatch:
    inputs:
      west:
        description: "WGS84 west longitude (desktop-study filter, not licence polygon)"
        type: string
        required: true
        default: "74"
      south:
        description: "WGS84 south latitude"
        type: string
        required: true
        default: "42"
      east:
        description: "WGS84 east longitude"
        type: string
        required: true
        default: "80"
      north:
        description: "WGS84 north latitude"
        type: string
        required: true
        default: "46"

permissions:
  contents: read

concurrency:
  group: gold-mrds-pilot-${{ github.ref }}
  cancel-in-progress: false

jobs:
  export-for-review:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      DJANGO_SECRET_KEY: test-only-key-gold-pilot-github-actions
      DEBUG: "True"
      DATABASE_URL: sqlite:///db.sqlite3
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.16"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install runtime requirements
        run: python -m pip install -r requirements.txt
      - name: Validate geographic input without shell interpolation
        shell: bash
        env:
          WEST: ${{ inputs.west }}
          SOUTH: ${{ inputs.south }}
          EAST: ${{ inputs.east }}
          NORTH: ${{ inputs.north }}
        run: |
          python - <<'PY'
          import json, math, os, pathlib
          vals = [float(os.environ[key]) for key in ('WEST','SOUTH','EAST','NORTH')]
          w,s,e,n=vals
          assert all(math.isfinite(v) for v in vals), 'bbox must be finite'
          assert -180 <= w < e <=180 and -90 <= s < n <=90, 'bbox invalid'
          pathlib.Path('/tmp/gold_bbox.json').write_text(json.dumps(vals))
          PY
      - name: Fetch historical records from official USGS host
        shell: bash
        run: |
          mkdir -p research-output
          python - <<'PY'
          import json
          from pathlib import Path
          from django.conf import settings
          import django
          django.setup()
          from gold_intelligence.management.commands.fetch_usgs_mrds_gold import collect_source_pages
          from gold_intelligence.management.commands.convert_usgs_mrds_gold import convert_mrds_features
          import hashlib
          from datetime import datetime, timezone
          bounds = tuple(json.loads(Path('/tmp/gold_bbox.json').read_text()))
          source = collect_source_pages(bounds)
          result, skipped = convert_mrds_features(source, bounds=bounds)
          if not result["features"]:
              raise SystemExit("No matched sourced gold records in study bbox; no empty dataset promoted.")
          if len(result["features"]) > 1000:
              raise SystemExit("Too many features for controlled review; narrow bbox.")
          path=Path('research-output/mrds_pilot.geojson')
          output=json.dumps(result,ensure_ascii=False,indent=2,sort_keys=True).encode('utf8')
          path.write_bytes(output)
          summary={
              "source":"https://energy.usgs.gov/arcgis/rest/services/Hosted/Mineral_Resource_Data_System/FeatureServer/0",
              "retrieved_at_utc": datetime.now(timezone.utc).isoformat(),
              "bbox_wgs84": list(bounds),
              "raw_features":len(source["features"]),
              "gold_historical_records":len(result["features"]),
              "skipped": skipped,
              "sha256": hashlib.sha256(output).hexdigest(),
              "rights_status":"unknown",
              "is_live_cadastre":False,
              "is_mineral_prospectivity":False,
              "is_verified_drilling_target":False,
              "imported_to_production":False,
              "required_next_step":"geologist+legal review before any production data import",
          }
          Path('research-output/provenance.json').write_text(json.dumps(summary,indent=2))
          print(json.dumps(summary,indent=2))
          PY
      - name: Stage only — validate schema and records without DB writes
        run: python manage.py import_gold_targets research-output/mrds_pilot.geojson
      - name: Upload source-preserving review artifact
        uses: actions/upload-artifact@v4
        with:
          name: kazakhstan-gold-mrds-review-only
          path: research-output/
          retention-days: 10
          if-no-files-found: error
