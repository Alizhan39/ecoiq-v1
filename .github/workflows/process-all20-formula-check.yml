# Branch-only validation for new process-to-20-KPI bridge. No deploys or writes.
name: EcoIQ process all-20 KPI coverage check

on:
  push:
    branches: [feat/process-all20-formula-review]

permissions:
  contents: read

jobs:
  django-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DEBUG: "True"
      DJANGO_SECRET_KEY: test-only-secret
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      DATABASE_URL: sqlite:///db.sqlite3
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.16"
      - name: Install current EcoIQ test requirements
        run: pip install -r requirements-dev.txt
      - name: Configuration and Ruff
        run: |
          ruff check api/v2_process_formula_review.py api/tests_v2_process_formula_review.py
          python manage.py check
          python manage.py makemigrations --check --dry-run
      - name: Contract and project-scope tests
        run: |
          python manage.py test api.tests_v2_process_formula_review api.tests_v2_formula_flow ecoiq_os.test_formula_registry --noinput

  react-flow:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/web/package-lock.json
      - name: Install and test
        working-directory: frontend/web
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm run lint
          npm test
          npm run build
