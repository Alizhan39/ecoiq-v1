# Disposable Wagtail compatibility audit, branch-only. Remove when verified.
name: Wagtail legacy migration compatibility audit

on:
  push:
    branches: [feat/wagtail-cms-staging-audit]

permissions:
  contents: read

jobs:
  standard-settings-unchanged:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DEBUG: "True"
      DJANGO_SECRET_KEY: test-only
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      DATABASE_URL: sqlite:///db.sqlite3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.16"
      - name: Install ordinary Django requirements
        run: pip install -r requirements-dev.txt
      - name: Ruff and standard Django smoke
        run: |
          ruff check ecoiq/settings_wagtail_audit.py core/tests_wagtail_cms_audit.py
          python manage.py check
          python manage.py test core.tests_wagtail_cms_audit --noinput
  isolated-wagtail-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      DEBUG: "True"
      DJANGO_SECRET_KEY: test-only
      DJANGO_SETTINGS_MODULE: ecoiq.settings_wagtail_audit
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      DATABASE_URL: sqlite:///db.sqlite3
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.16"
      - name: Install pinned Wagtail only for isolated audit
        run: pip install -r requirements-wagtail-audit.txt
      - name: Validate Wagtail and existing migrations
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py test core.tests_wagtail_cms_audit --noinput --verbosity=2
