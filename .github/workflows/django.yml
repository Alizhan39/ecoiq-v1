name: EcoIQ Django CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # Static checks first. The Django suite below takes ~13 minutes; Ruff takes
  # seconds, so gating on it avoids spending runner time on code with an
  # undefined name in it. Blocking: no continue-on-error, and a non-zero exit
  # fails the workflow.
  ruff:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.16"

      # Print the resolved interpreter. The version is pinned above, but the
      # log is what lets anyone confirm which one a given run actually used —
      # production once drifted to 3.14 while CI tested 3.11 and nothing said so.
      - name: Report Python version
        run: python -VV

      - name: Install Ruff
        # The pinned version from requirements-dev.txt, installed on its own so
        # this job does not pay for the full application dependency tree.
        run: pip install "$(grep -E '^ruff==' requirements-dev.txt)"

      - name: Ruff lint
        # No --fix. CI reports; it never rewrites the tree. A fix belongs in a
        # commit a human reviewed, not in a build artefact nobody sees.
        run: ruff check --output-format=github .

  # Static typing for the Stage 1 surface only. `mypy .` reports 960 errors
  # across the repository and is informational; this gate covers the modules
  # that decide whether a public request is abuse. See
  # docs/engineering/python-typing.md.
  #
  # Runs alongside ruff rather than after it: both are fast, independent, and a
  # developer wants both answers at once. Both must pass before the ~13-minute
  # suite starts.
  mypy:
    runs-on: ubuntu-latest

    env:
      DJANGO_SECRET_KEY: test-secret-key
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_URL: sqlite:///db.sqlite3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.16"

      # Print the resolved interpreter. The version is pinned above, but the
      # log is what lets anyone confirm which one a given run actually used —
      # production once drifted to 3.14 while CI tested 3.11 and nothing said so.
      - name: Report Python version
        run: python -VV

      - name: Install dependencies
        # The full tree: the django-stubs plugin loads Django settings, so it
        # needs the application's own dependencies importable.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: mypy (Stage 1 typed surface)
        # Identical to the documented local command. No --ignore-errors, no
        # suppression generation, no source mutation.
        #
        # --follow-imports=silent uses imported modules for type information but
        # reports only the paths named here. Without it this job would fail on
        # errors in files the PR does not claim to have typed. It is NOT
        # follow_imports=skip, which would discard the type information itself.
        run: |
          python -m mypy \
            core/client_origin.py \
            notifications/antispam \
            companies/throttle.py \
            notifications/management/commands/analyse_notification_spam.py \
            notifications/management/commands/classify_notification_spam.py \
            --follow-imports=silent

  # The React SPA. Typecheck, lint and unit tests, then a REBUILD-AND-DIFF.
  #
  # static/spa/ is a committed build artefact (Render's Python environment has
  # no Node toolchain — see vite.config.ts). A committed artefact is only
  # trustworthy if something proves it matches the source it claims to be built
  # from, so this job rebuilds it from a clean `npm ci` and fails if the tree is
  # dirty afterwards. Without that step, an edit to a .tsx file that nobody
  # rebuilt would pass every test in the repository and ship nothing.
  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend/web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/web/package-lock.json

      # `npm ci`, never `npm install`: it installs exactly the lockfile and
      # fails if package.json and package-lock.json disagree.
      - name: Install dependencies (deterministic)
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Committed artefact matches source
        working-directory: .
        run: |
          if ! git diff --quiet -- static/spa; then
            echo "::error::static/spa/ is stale — it does not match a fresh build of frontend/web/src."
            echo "Run: npm --prefix frontend/web ci && npm --prefix frontend/web run build"
            echo "then commit static/spa/."
            git --no-pager diff --stat -- static/spa
            exit 1
          fi
          echo "static/spa/ matches a fresh build."

  # The AI-tooling layer that PR #300 added: nine third-party skills pinned to
  # reviewed commits, plus the Excel MCP boundary. Those skills are files from
  # untrusted upstreams that Claude reads as instructions, and their payloads
  # are gitignored (CLAUDE.md rule 14) — so nothing in a normal checkout proves
  # the installed tree still matches what was audited.
  #
  # This job installs them from the pinned SHAs and re-runs the audit. It fails
  # when an installed skill drifts from the lockfile, when provenance is missing
  # or names the wrong commit, when a skill appears that no lockfile entry
  # covers (i.e. added without review metadata), or when an installed skill
  # contains an actual instruction-override directive.
  #
  # All of the logic lives in scripts/ and core/tests_ai_tooling.py. Nothing is
  # reimplemented here: a check that exists only in YAML cannot be run locally,
  # and one nobody runs locally is one nobody fixes.
  #
  # Fast enough to gate the ~18-minute suite, so django-check needs it.
  ai-skills:
    runs-on: ubuntu-latest

    env:
      DJANGO_SECRET_KEY: test-secret-key
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_URL: sqlite:///db.sqlite3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.16"
          # setup-python's own pip cache. The other Python jobs predate this
          # being wired up; adding it here does not change theirs.
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Report Python version
        run: python -VV

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # The only network step in this job. Keyed on the lockfile AND the
      # installer, so a re-pin busts the cache and the upstreams are re-fetched
      # and re-verified; an unchanged pin set is a cache hit and touches no
      # remote at all. That is what keeps this job off the network on the vast
      # majority of runs, rather than cloning five repositories every time.
      - name: Cache installed third-party skills
        id: skills-cache
        uses: actions/cache@v4
        with:
          path: .claude/skills
          key: ai-skills-${{ hashFiles('docs/ai-tooling/third-party-skills.lock.json', 'scripts/ai-tooling/install-third-party-skills.sh') }}

      # Idempotent, and it verifies each resolved SHA against the pin before
      # copying — so "the pinned commit still exists upstream and is what we
      # think it is" is checked here, at install time, rather than by a
      # per-run API call that would make CI depend on github.com being
      # reachable for every unrelated change.
      - name: Install third-party skills at pinned commits
        if: steps.skills-cache.outputs.cache-hit != 'true'
        run: bash scripts/ai-tooling/install-third-party-skills.sh

      - name: Verify every locked skill is present
        run: bash scripts/ai-tooling/install-third-party-skills.sh --check

      # Blocking. EcoIQ's own ecoiq-* skills are project source: a skill
      # pointing at a deleted module, or two claiming one trigger, is a
      # confidently wrong instruction. main merged these skills in #299 without
      # this gate; this restores it.
      - name: Validate EcoIQ skills (strict)
        run: python manage.py validate_skills --strict

      # Lockfile/installer drift, provenance, unreviewed-skill detection, the
      # injection scan over every installed skill, the Excel MCP stdio guard,
      # and the control tests that prove each of those failure modes actually
      # fails.
      - name: Audit the third-party skill tree
        run: python manage.py test core.tests_ai_tooling --verbosity=2

      # NOT run here: `manage.py seo_audit`.
      #
      # It is a different boundary — public-page discoverability, not skill
      # integrity — and it is not currently deterministic in CI: it reports
      # three findings that depend on what the app serves and on an asset
      # (brand/ecoiq-og.png) that does not exist yet, one of which is a known
      # open product bug. Wiring it in as a blocking gate would fail unrelated
      # pull requests on a finding nobody introduced.
      #
      # Adding it belongs in its own change, after the og:image asset lands and
      # `--strict` is actually clean. Tracked as a follow-up, deliberately not
      # smuggled into this one.

  django-check:
    needs: [ruff, mypy, ai-skills]
    runs-on: ubuntu-latest

    env:
      DJANGO_SECRET_KEY: test-secret-key
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_URL: sqlite:///db.sqlite3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.16"

      # Print the resolved interpreter. The version is pinned above, but the
      # log is what lets anyone confirm which one a given run actually used —
      # production once drifted to 3.14 while CI tested 3.11 and nothing said so.
      - name: Report Python version
        run: python -VV

      - name: Install dependencies
        # requirements-dev.txt includes requirements.txt and adds the test-only
        # packages. Production installs requirements.txt alone (render.yaml), so
        # nothing here reaches the running service.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Django system check
        run: python manage.py check

      - name: Run migrations check
        run: python manage.py makemigrations --check --dry-run

      # Blocking: a red suite must turn the workflow red.
      #
      # This step previously carried `continue-on-error: true`, which meant no
      # test failure could ever fail CI. Two things were hiding behind it:
      #
      #   1. Two stale assertions in good_agents, unnoticed for eleven days
      #      after PR13 changed the seeded provider count. Corrected in the
      #      commit this branch builds on.
      #   2. This job's own environment. The job-level DEBUG=False is right for
      #      the `check` steps above, but at settings-import time it also turns
      #      on SECURE_SSL_REDIRECT, so every test-client request 301s and
      #      ~1400 tests fail. Reproduced on a pristine main checkout; the same
      #      commit passes with DEBUG=true.
      #
      # DEBUG is therefore overridden for this step only: the checks stay
      # production-like, and the suite runs as a test process rather than as a
      # production one.
      #
      # Do not re-add continue-on-error to make a red suite go green. Fix the
      # test, or fix the code it is testing.
      - name: Run tests
        env:
          DEBUG: "True"
        run: python manage.py test
