name: EcoIQ Django CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # Static checks first. The Django suite below takes ~13 minutes; Ruff takes
  # seconds, so gating on it avoids spending runner time on code with an
  # undefined name in it. Blocking: no continue-on-error, and a non-zero exit
  # fails the workflow.
  ruff:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Ruff
        # The pinned version from requirements-dev.txt, installed on its own so
        # this job does not pay for the full application dependency tree.
        run: pip install "$(grep -E '^ruff==' requirements-dev.txt)"

      - name: Ruff lint
        # No --fix. CI reports; it never rewrites the tree. A fix belongs in a
        # commit a human reviewed, not in a build artefact nobody sees.
        run: ruff check --output-format=github .

  # Static typing for the Stage 1 surface only. `mypy .` reports 960 errors
  # across the repository and is informational; this gate covers the modules
  # that decide whether a public request is abuse. See
  # docs/engineering/python-typing.md.
  #
  # Runs alongside ruff rather than after it: both are fast, independent, and a
  # developer wants both answers at once. Both must pass before the ~13-minute
  # suite starts.
  mypy:
    runs-on: ubuntu-latest

    env:
      DJANGO_SECRET_KEY: test-secret-key
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_URL: sqlite:///db.sqlite3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        # The full tree: the django-stubs plugin loads Django settings, so it
        # needs the application's own dependencies importable.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: mypy (Stage 1 typed surface)
        # Identical to the documented local command. No --ignore-errors, no
        # suppression generation, no source mutation.
        #
        # --follow-imports=silent uses imported modules for type information but
        # reports only the paths named here. Without it this job would fail on
        # errors in files the PR does not claim to have typed. It is NOT
        # follow_imports=skip, which would discard the type information itself.
        run: |
          python -m mypy \
            core/client_origin.py \
            notifications/antispam \
            companies/throttle.py \
            notifications/management/commands/analyse_notification_spam.py \
            notifications/management/commands/classify_notification_spam.py \
            --follow-imports=silent

  django-check:
    needs: [ruff, mypy]
    runs-on: ubuntu-latest

    env:
      DJANGO_SECRET_KEY: test-secret-key
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_URL: sqlite:///db.sqlite3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        # requirements-dev.txt includes requirements.txt and adds the test-only
        # packages. Production installs requirements.txt alone (render.yaml), so
        # nothing here reaches the running service.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Django system check
        run: python manage.py check

      - name: Run migrations check
        run: python manage.py makemigrations --check --dry-run

      # Blocking: a red suite must turn the workflow red.
      #
      # This step previously carried `continue-on-error: true`, which meant no
      # test failure could ever fail CI. Two things were hiding behind it:
      #
      #   1. Two stale assertions in good_agents, unnoticed for eleven days
      #      after PR13 changed the seeded provider count. Corrected in the
      #      commit this branch builds on.
      #   2. This job's own environment. The job-level DEBUG=False is right for
      #      the `check` steps above, but at settings-import time it also turns
      #      on SECURE_SSL_REDIRECT, so every test-client request 301s and
      #      ~1400 tests fail. Reproduced on a pristine main checkout; the same
      #      commit passes with DEBUG=true.
      #
      # DEBUG is therefore overridden for this step only: the checks stay
      # production-like, and the suite runs as a test process rather than as a
      # production one.
      #
      # Do not re-add continue-on-error to make a red suite go green. Fix the
      # test, or fix the code it is testing.
      - name: Run tests
        env:
          DEBUG: "True"
        run: python manage.py test
