# One-off branch-only build helper for the new React Flow dependency.
# Never runs on main or production deployment. Remove after review.
name: Formula Flow branch build and lock sync

on:
  push:
    branches:
      - feat/sequential-kpi-reactflow

permissions:
  contents: write

jobs:
  prepare-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Resolve and pin React Flow dependencies (no install scripts)
        working-directory: frontend/web
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Install pinned lock dependencies
        working-directory: frontend/web
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        working-directory: frontend/web
        run: npm run typecheck
      - name: ESLint
        working-directory: frontend/web
        run: npm run lint
      - name: Unit tests
        working-directory: frontend/web
        run: npm test
      - name: Build committed Django-served SPA
        working-directory: frontend/web
        run: npm run build
      - name: Commit only generated lockfile and SPA artifacts to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- frontend/web/package-lock.json static/spa
          if ! git diff --cached --quiet; then
            git commit -m "Generate pinned React Flow lockfile and reproducible SPA build"
            git push origin HEAD:feat/sequential-kpi-reactflow
          fi

  django-formulas:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      DJANGO_SECRET_KEY: test-only-secret
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      DATABASE_URL: sqlite:///db.sqlite3
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.16"
      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Django checks
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
      - name: Formula, access, and gateway contracts
        run: |
          python manage.py test api.tests_v2_formula_flow core.tests_formula_studio ecoiq_os.test_formula_registry ai_gateway.tests_workflow_contracts --noinput
