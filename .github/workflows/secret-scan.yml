name: Secret scan

# Blocks credentials from entering the repository. Added after an incident in
# which a fallback administrator password shipped inside a management command
# (see docs/security/admin-credential-rotation.md).
#
# Deliberately minimal: Gitleaks' default rule set, no committed allowlist. If a
# genuine false positive ever needs suppressing, add a narrow, individually
# commented entry to a .gitleaks.toml — never a broad path or pattern, which
# would hide real credentials too.

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Full history so a secret added in an earlier commit of a pull
          # request is caught, not just the tip.
          fetch-depth: 0

      # Pinned version, and the download is checksum-verified against the
      # release's own published checksums file before it is executed — a
      # security job must not run an unverified binary.
      - name: Install Gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL "${base}/${archive}" -o "${archive}"
          curl -sSfL "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt" -o checksums.txt
          grep " ${archive}\$" checksums.txt | sha256sum -c -
          tar -xzf "${archive}" gitleaks
          chmod +x gitleaks
          ./gitleaks version

      # --redact: findings are reported by rule, file, and line — the secret
      # value itself is never written to the workflow log.
      # --exit-code 1: any probable secret fails the job.
      - name: Scan repository for secrets
        run: ./gitleaks detect --source . --redact --verbose --exit-code 1
