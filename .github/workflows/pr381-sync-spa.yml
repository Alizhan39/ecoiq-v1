name: Temporary SPA sync for PR 381
on:
  push:
    branches:
      - feat/sequential-kpi-reactflow
    paths:
      - .github/workflows/pr381-sync-spa.yml

permissions:
  contents: write

jobs:
  rebuild:
    if: github.repository == 'Alizhan39/ecoiq-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout the feature branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/web/package-lock.json
      - name: Rebuild SPA from lockfile
        run: |
          npm --prefix frontend/web ci
          npm --prefix frontend/web run build
      - name: Commit and push generated assets to this feature branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A static/spa
          if ! git diff --cached --quiet; then
            git commit -m "build: regenerate committed SPA from process formula source"
            git push origin HEAD:feat/sequential-kpi-reactflow
          fi
