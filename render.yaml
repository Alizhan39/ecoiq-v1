# ══════════════════════════════════════════════════════════════════════════════
# EcoIQ — Render Blueprint
# Docs: https://render.com/docs/blueprint-spec
#
# THIS BLUEPRINT DOES NOT DESCRIBE THE RUNNING ESTATE.
#
# Services declared here:
#   ecoiq       — Django/Gunicorn web service (starter plan, Oregon)
#   ecoiq-db    — PostgreSQL database (starter plan, Oregon)
#
# Services ALSO RUNNING in production, created by hand in the Render dashboard
# on 2026-08-24 and therefore absent from this file:
#   ecoiq-keyvalue        — Redis. Django cache AND Celery broker/result
#                           backend. /readyz/ reports redis: ok.
#   ecoiq-celery-worker   — running, connected, idle (nothing schedules work)
#   four cron jobs        — ecoiq-daily-yfinance, ecoiq-ml-retrain,
#                           ecoiq-rss-signals, ecoiq-weekly-full-ingest,
#                           ALL SUSPENDED
#
# The commented Key Value and worker blocks further down say those services are
# "NOT enabled by default". Read as a description of production that is now
# wrong; read as a description of THIS FILE it is still accurate, which is
# exactly how the estate and its blueprint came apart without anyone noticing.
#
# Closing the gap — adding the real services here, or removing them from Render
# — is an owner decision with a monthly cost attached, and is deliberately not
# made by editing this comment. Do not assume a blueprint sync will leave
# hand-made services alone.
# See docs/operations/PRODUCTION_RUNBOOK.md for the measured inventory.
#
# build.sh is DB-FREE — the build environment cannot reach the private database
# network (the internal hostname dpg-…-a only resolves at runtime). Migrations +
# seeding run at runtime via the Pre-Deploy Command (predeploy.sh) and start.sh,
# both best-effort, so a temporarily-unavailable database never blocks a deploy.
# Secrets (ANTHROPIC_API_KEY, COMPANIES_HOUSE_API_KEY) must be set
# manually in the Render dashboard — they are never committed to git.
# ══════════════════════════════════════════════════════════════════════════════

services:
  - type: web
    name: ecoiq                          # Blueprint matches by this name — do NOT rename
    env: python
    region: oregon
    plan: starter                        # $7/month — persistent disk, no cold starts
    buildCommand: pip install -r requirements.txt && ./build.sh
    # Pre-Deploy runs once per deploy in the runtime network (internal DB hostname
    # resolves here) — migrations + seeding live here, not in the build.
    preDeployCommand: ./predeploy.sh
    # start.sh runs a fast best-effort migrate (safety net) then launches Gunicorn.
    # 1 worker, 4 threads (gthread) — Render Starter plan is 512 MB RAM.
    # gthread lets 4 requests run concurrently (I/O overlap) without forking
    # a second full Python process. max-requests recycles the worker after
    # 300 requests to prevent WeasyPrint PDF memory from accumulating.
    startCommand: ./start.sh

    # Liveness only. /healthz/ returns a constant `ok` and touches no database,
    # cache or broker, so a database blip cannot make Render replace a web
    # process that is actually healthy. Do NOT repoint this at "/" (renders the
    # homepage: 12 queries and ~149 KB, measured) or at a future /readyz/
    # (which would check the database) —
    # readiness and liveness are different signals and only one of them belongs
    # in a restart decision. See core/health.py.
    healthCheckPath: /healthz/

    envVars:
      - key: PYTHON_VERSION
        value: "3.11.16"

      - key: WEB_CONCURRENCY
        value: "1"                       # belt-and-suspenders: matches --workers above

      - key: DEBUG
        value: "False"                   # always False in production

      - key: DJANGO_SETTINGS_MODULE
        value: ecoiq.settings

      - key: DJANGO_SECRET_KEY
        generateValue: true              # Render generates and rotates this automatically

      # Explicit host list — a wildcard disables Django's Host-header
      # validation, which re-opens Host-header poisoning of password-reset and
      # other absolute URLs. settings.py refuses to start on "*" when
      # DEBUG=False. Add any new custom domain here AND in CSRF_TRUSTED_ORIGINS.
      - key: ALLOWED_HOSTS
        value: "ecoiq.onrender.com ecoiq.uk www.ecoiq.uk"

      - key: CSRF_TRUSTED_ORIGINS
        value: "https://ecoiq.onrender.com,https://ecoiq.uk,https://www.ecoiq.uk"

      - key: SITE_URL
        value: "https://ecoiq.uk"

      - key: DATABASE_URL
        fromDatabase:
          name: ecoiq-db                 # links to the database service below
          property: connectionString

      - key: ANTHROPIC_API_KEY
        sync: false                      # set manually in Render dashboard — never in git

      - key: COMPANIES_HOUSE_API_KEY
        sync: false                      # set manually in Render dashboard — never in git

      # ── Stripe billing (ecoiq_commerce) ──────────────────────────────────
      # Merchant of record: Stoke Share Ltd, trading as EcoIQ.
      #
      # Every credential is sync:false and must be pasted into the Render
      # dashboard by hand. Blank keys are a SAFE state, not a broken one:
      # /billing/ checkout and portal endpoints report "billing is not
      # configured" and the webhook endpoint refuses unverifiable traffic.
      #
      # Ship with TEST-mode keys. settings.py refuses to start on an sk_live_
      # key unless STRIPE_LIVE_MODE_ALLOWED is also true, so going live is a
      # deliberate two-step act, not a side effect of pasting a key.
      #
      # The webhook endpoint to register in the Stripe Dashboard is:
      #     https://ecoiq.uk/billing/webhook/
      - key: ECOIQ_BILLING_PROVIDER
        value: "none"                    # flip to "stripe" once keys are set
      - key: STRIPE_SECRET_KEY
        sync: false                      # set manually in Render dashboard — never in git
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false                      # per-endpoint signing secret (whsec_…)

      # Price ids are public catalogue identifiers, not secrets — but they
      # differ between the test and live Stripe accounts, so they are still
      # set per-environment rather than committed.
      - key: STRIPE_PRICE_STARTER_MONTHLY
        sync: false
      - key: STRIPE_PRICE_STARTER_YEARLY
        sync: false
      - key: STRIPE_PRICE_PRO_MONTHLY
        sync: false
      - key: STRIPE_PRICE_PRO_YEARLY
        sync: false

      # Stripe Tax stays OFF until Stoke Share Ltd's tax registrations are
      # confirmed in the Stripe Dashboard. Turning it on early puts incorrect
      # tax on real customer invoices.
      - key: STRIPE_AUTOMATIC_TAX_ENABLED
        value: "false"
      - key: STRIPE_TAX_ID_COLLECTION_ENABLED
        value: "false"

      # Live-mode latch — see the note above. Do not set true until the live
      # account, webhook endpoint and tax position have all been verified.
      - key: STRIPE_LIVE_MODE_ALLOWED
        value: "false"

      # ── EcoIQ AI Gateway (ai_gateway app) ────────────────────────────────
      # Configuration only — no new service, no new plan, no cost. Every AI
      # provider key is sync:false and must be pasted into the Render
      # dashboard by hand; a blank key simply means that provider contributes
      # no models, which is a safe (not a broken) state.
      - key: AI_ENABLED
        value: "true"                    # master switch for the whole gateway
      - key: AI_FREE_ONLY
        value: "true"                    # master switch: no paid model is ever shown or called
      - key: AI_ALLOW_PAID_MODELS
        value: "false"
      - key: AI_MODEL_SELECTION_MODE
        value: "automatic"               # EcoIQ chooses; no public model selector
      - key: AI_ROUTING_MODE
        value: "automatic"               # capability-scored routing
      - key: AI_STAFF_MODEL_OVERRIDE_ENABLED
        value: "true"                    # staff benchmarking only; free models only
      - key: AI_DEFAULT_MODEL_KEY
        value: "openrouter:auto-free"    # public catch-all, LAST in the chain
      - key: AI_MODEL_CATALOG_CACHE_SECONDS
        value: "3600"
      - key: AI_ALLOW_AUTOMATIC_FALLBACK
        value: "true"
      - key: AI_MAX_PROVIDER_ATTEMPTS
        value: "3"

      - key: OPENROUTER_ENABLED
        value: "true"
      - key: OPENROUTER_API_KEY
        sync: false                      # set manually in Render dashboard — never in git
      - key: OPENROUTER_BASE_URL
        value: "https://openrouter.ai/api/v1"
      - key: OPENROUTER_SITE_URL
        value: "https://ecoiq.ai"
      - key: OPENROUTER_APP_NAME
        value: "EcoIQ"
      - key: OPENROUTER_TIMEOUT_SECONDS
        value: "60"
      - key: OPENROUTER_MAX_OUTPUT_TOKENS
        value: "1600"
      - key: OPENROUTER_FREE_ROUTER_ENABLED
        value: "true"
      - key: OPENROUTER_FREE_ROUTER_MODEL
        value: "openrouter/free"
      - key: OPENROUTER_ZDR_ENABLED
        value: "true"

      # Bytez ships with an empty allowlist. Setting a key alone does NOT
      # make any Bytez model usable — see BYTEZ_APPROVED_MODELS below.
      - key: BYTEZ_ENABLED
        value: "false"                   # OFF — code retained, see AI-GATEWAY.md
      - key: BYTEZ_API_KEY
        sync: false                      # set manually in Render dashboard — never in git
      - key: BYTEZ_OPENAI_BASE_URL
        value: "https://api.bytez.com/models/v2/openai/v1"
      - key: BYTEZ_MODELS_URL
        value: "https://api.bytez.com/models/v2/list/models"
      - key: BYTEZ_TIMEOUT_SECONDS
        value: "60"
      - key: BYTEZ_MAX_OUTPUT_TOKENS
        value: "1200"
      - key: BYTEZ_FREE_ONLY
        value: "true"
      - key: BYTEZ_ALLOW_PAID_CREDITS
        value: "false"                   # never spend credits, never auto-reload
      - key: BYTEZ_ALLOW_CLOSED_MODELS
        value: "false"
      # Curated Bytez allowlist. Deliberately EMPTY here rather than a long
      # stale literal list: populate it in the dashboard only after running
      #   python manage.py refresh_ai_models --provider bytez --dry-run --explain
      # with a real key and confirming the ids it reports.
      - key: BYTEZ_APPROVED_MODELS
        value: ""

      # NVIDIA Developer Program endpoints are prototype/development access.
      # Do NOT set NVIDIA_NIM_PUBLIC_PRODUCTION_ENABLED=true until licensing
      # for public production traffic has been separately approved.
      - key: NVIDIA_NIM_ENABLED
        value: "true"                    # staff/development only; never public
      - key: NVIDIA_NIM_API_KEY
        sync: false                      # set manually in Render dashboard — never in git
      - key: NVIDIA_NIM_BASE_URL
        value: "https://integrate.api.nvidia.com/v1"
      - key: NVIDIA_NIM_TIMEOUT_SECONDS
        value: "60"
      - key: NVIDIA_NIM_MAX_OUTPUT_TOKENS
        value: "1600"
      - key: NVIDIA_NIM_PROTOTYPE_ONLY
        value: "true"
      - key: NVIDIA_NIM_PUBLIC_PRODUCTION_ENABLED
        value: "false"

# REDIS_URL is intentionally NOT added as a live env var above — see the
# Backend Intelligence Engine block at the end of this file for why, and
# what to add (to both this service and the new worker) to enable it.

# ── Database ──────────────────────────────────────────────────────────────────
databases:
  - name: ecoiq-db
    databaseName: ecoiq
    user: ecoiq
    plan: starter                        # $7/month PostgreSQL — 1 GB storage
    region: oregon                       # same region as web service for low latency

# ══════════════════════════════════════════════════════════════════════════════
# Backend Intelligence Engine (Celery + Redis) — NOT enabled by default.
#
# Uncomment the two blocks below to actually run background tasks in
# production. This is a real, additional cost decision, not something that
# should ship silently as a side effect of this PR:
#   - a Render Key Value (Redis) instance: from ~$10/month (Starter)
#   - a Render Background Worker running `celery -A ecoiq worker`: from
#     ~$7/month (Starter, same plan tier as the web service)
#
# Until uncommented, `python manage.py shell` / management commands can still
# call a task's `.apply()` (synchronous, in-process, no broker needed) —
# only `.delay()`/`.apply_async()` require these services to actually exist.
#
# services:
#   - type: redis
#     name: ecoiq-redis
#     region: oregon
#     plan: starter
#     ipAllowList: []                    # internal-only — no public network access
#
#   - type: worker
#     name: ecoiq-celery-worker
#     env: python
#     region: oregon
#     plan: starter
#     buildCommand: pip install -r requirements.txt
#     startCommand: celery -A ecoiq worker --loglevel=info --concurrency=2 --max-tasks-per-child=100
#     envVars:
#       - key: PYTHON_VERSION
#         value: "3.11.16"
#       - key: DJANGO_SETTINGS_MODULE
#         value: ecoiq.settings
#       - key: DJANGO_SECRET_KEY
#         sync: false                    # copy the same value as the `ecoiq` web service
#       - key: DATABASE_URL
#         fromDatabase:
#           name: ecoiq-db
#           property: connectionString
#       - key: REDIS_URL
#         fromService:
#           name: ecoiq-redis
#           type: redis
#           property: connectionString
#       - key: ANTHROPIC_API_KEY
#         sync: false
# ══════════════════════════════════════════════════════════════════════════════

# ══════════════════════════════════════════════════════════════════════════════
# Continuous Stewardship Monitor (scheduled refresh) — NOT enabled by default.
#
# Uncomment to actually run a periodic Stewardship Universe refresh in
# production. This is a real, additional Render cron-job cost decision, not
# something that should ship silently as a side effect of this PR — same
# discipline as the Celery block above. Until uncommented, "scheduled
# refresh" only happens if you invoke the management command yourself
# (manually, or via your own external scheduler) — no claim of "continuous
# monitoring" is made unless this (or an equivalent scheduler) is genuinely
# running. --due-only means each company/source is only actually re-fetched
# per its own refresh_policy interval, however often this job itself ticks;
# --scheduled records the honest triggered_by='scheduled' provenance on
# every CompanyRefreshRun this produces, and gates per-source fetches to
# only those refresh_policy says are actually due (never re-hammers a
# provider just because the cron ticked).
#
# services:
#   - type: cron
#     name: ecoiq-stewardship-monitor
#     env: python
#     region: oregon
#     plan: starter
#     schedule: "0 6 * * *"              # once daily, 06:00 UTC — adjust to taste
#     buildCommand: pip install -r requirements.txt
#     startCommand: python manage.py refresh_stewardship_universe --due-only --scheduled --limit 50
#     envVars:
#       - key: PYTHON_VERSION
#         value: "3.11.16"
#       - key: DJANGO_SETTINGS_MODULE
#         value: ecoiq.settings
#       - key: DJANGO_SECRET_KEY
#         sync: false                    # copy the same value as the `ecoiq` web service
#       - key: DATABASE_URL
#         fromDatabase:
#           name: ecoiq-db
#           property: connectionString
#       - key: COMPANIES_HOUSE_API_KEY
#         sync: false
# ══════════════════════════════════════════════════════════════════════════════

# ══════════════════════════════════════════════════════════════════════════════
# Good While You Sleep — 114 Good Agents overnight discovery — NOT enabled by
# default. SCHEDULER READY, not SCHEDULER ACTIVE (see docs/GOOD_WHILE_YOU_SLEEP.md)
# until this block is uncommented — same discipline as the two blocks above.
#
# Fetches from the 3 real, bounded public SignalProviders (USGS significant
# earthquakes, GOV.UK grant/funding search, UK Environment Agency flood
# monitoring — see good_agents/services/provider_adapters.py), runs every
# enabled GoodMission through the GlobalGoodDiscoveryEngine, and prints the
# Morning Brief. Idempotent per (mission, run-date): re-running the same day
# is a no-op for any mission that already completed. One provider's failure
# never stops the others (see good_agents/services/ingestion.py).
#
# services:
#   - type: cron
#     name: ecoiq-good-while-you-sleep
#     env: python
#     region: oregon
#     plan: starter
#     schedule: "0 5 * * *"              # once daily, 05:00 UTC — adjust to taste
#     buildCommand: pip install -r requirements.txt
#     startCommand: python manage.py run_good_while_you_sleep
#     envVars:
#       - key: PYTHON_VERSION
#         value: "3.11.16"
#       - key: DJANGO_SETTINGS_MODULE
#         value: ecoiq.settings
#       - key: DJANGO_SECRET_KEY
#         sync: false                    # copy the same value as the `ecoiq` web service
#       - key: DATABASE_URL
#         fromDatabase:
#           name: ecoiq-db
#           property: connectionString
# ══════════════════════════════════════════════════════════════════════════════
